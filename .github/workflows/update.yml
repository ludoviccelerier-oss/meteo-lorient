name: Mise à jour de la carte

on:
  schedule:
    # Toutes les 5 min : vent réel. Les prévisions ne sont recalculées qu'une fois par heure
    # (fetch_forecast.py --min-interval) ; entre-temps la dernière sortie est republiée.
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Recalculer les prévisions sans attendre l'heure"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # État conservé d'un passage à l'autre : historique du vent réel et fichiers de
      # prévision déjà découpés (seuls les nouveaux GRIB sont téléchargés).
      - name: Restaurer l'état précédent
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Repli sur les données publiées
        run: |
          mkdir -p state public/data
          [ -s state/live.json ] || curl -fsSL "$SITE_URL/data/live.json" -o state/live.json || rm -f state/live.json
          [ -s state/forecast.json ] || curl -fsSL "$SITE_URL/data/forecast.json" -o state/forecast.json || rm -f state/forecast.json

      - name: Vent réel (windmorbihan)
        run: python scripts/fetch_live.py --previous state/live.json --out public/data/live.json

      - name: Prévisions (AROME, MFWAM)
        run: >
          python scripts/fetch_forecast.py --state state --out public/data/forecast.json
          ${{ inputs.force && '--force' || '' }}

      - name: Sauvegarder l'état
        run: cp public/data/live.json state/live.json

      - uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}

      # GitHub Pages ne sert que les données : la page publique est sur Netlify.
      # Une simple redirection évite un doublon de contenu pour les moteurs de recherche.
      - name: Redirection vers Netlify
        run: cp pages/index.html public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
