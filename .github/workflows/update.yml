name: Mise à jour de la carte

on:
  schedule:
    - cron: "*/10 * * * *"   # vent réel ; les prévisions ne sont retéléchargées qu'à chaque nouveau run
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Retélécharger les prévisions même si le run est déjà publié"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # État du passage précédent (historique du vent réel, run des prévisions déjà traité) :
      # évite de retélécharger ~600 Mo AROME toutes les 10 minutes.
      - name: Restaurer l'état précédent
        uses: actions/cache/restore@v4
        with:
          path: prev
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Repli sur les données publiées
        run: |
          mkdir -p prev public/data
          [ -s prev/live.json ] || curl -fsSL "$SITE_URL/data/live.json" -o prev/live.json || rm -f prev/live.json
          [ -s prev/forecast.json ] || curl -fsSL "$SITE_URL/data/forecast.json" -o prev/forecast.json || rm -f prev/forecast.json

      - name: Vent réel (windmorbihan)
        run: python scripts/fetch_live.py --previous prev/live.json --out public/data/live.json

      - name: Prévisions (AROME, MFWAM)
        run: >
          python scripts/fetch_forecast.py --previous prev/forecast.json
          --out public/data/forecast.json ${{ inputs.force && '--force' || '' }}

      - name: Sauvegarder l'état
        run: rm -rf prev && cp -r public/data prev

      - uses: actions/cache/save@v4
        with:
          path: prev
          key: state-${{ github.run_id }}

      - run: cp -r web/. public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
