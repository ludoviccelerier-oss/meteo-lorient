name: Mise à jour de la carte

on:
  schedule:
    - cron: "*/10 * * * *"   # vent réel ; les prévisions ne sont retéléchargées qu'à chaque nouveau run
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # État conservé d'un passage à l'autre : historique du vent réel et fichiers de
      # prévision déjà découpés (seuls les nouveaux GRIB sont téléchargés).
      - name: Restaurer l'état précédent
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Repli sur les données publiées
        run: |
          mkdir -p state public/data
          [ -s state/live.json ] || curl -fsSL "$SITE_URL/data/live.json" -o state/live.json || rm -f state/live.json

      - name: Vent réel (windmorbihan)
        run: python scripts/fetch_live.py --previous state/live.json --out public/data/live.json

      - name: Prévisions (AROME, MFWAM)
        run: python scripts/fetch_forecast.py --cache state/forecast_cache.json --out public/data/forecast.json

      - name: Sauvegarder l'état
        run: cp public/data/live.json state/live.json

      - uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}

      - run: cp -r web/. public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
